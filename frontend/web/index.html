<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Primary Meta Tags -->
  <title>Research Terminal | AI-Powered Equity Research</title>
  <meta name="title" content="Research Terminal | AI-Powered Equity Research">
  <meta name="description" content="Institutional-grade equity research terminal powered by multi-agent AI and real-time market data. Analyze stocks, valuations, earnings, and side-by-side fundamentals.">
  <meta name="keywords" content="equity research, stock analysis, financial terminal, stock market, investment analysis, valuation, AI finance, stock comparison, algorithmic research">
  <meta name="author" content="Research Terminal">
  <meta name="robots" content="index, follow">

  <!-- Theme & Browser UI -->
  <meta name="theme-color" content="#0C0D12">
  <meta name="msapplication-TileColor" content="#0C0D12">

  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon.png">
  <link rel="shortcut icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #0C0D12;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    }
    #loading-indicator {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #00F0FF;
      font-size: 13px;
      letter-spacing: 1.5px;
    }
    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid rgba(0, 240, 255, 0.2);
      border-top-color: #00F0FF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-indicator">
    <div class="spinner"></div>
    <div>INITIALIZING RESEARCH TERMINAL...</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
